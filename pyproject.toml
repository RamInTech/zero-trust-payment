[project]
name = "zerotrust-razorpay"
version = "0.1.0"
description = "Zero-Trust Payment Authorization for AI Agents on Razorpay"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.1.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zerotrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Razorpay test-mode API; skipped unless RAZORPAY_KEY_ID is set",
]
